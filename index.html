<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LICENSE_21.EXE</title>
    <link rel="stylesheet" href="terminal.css">
    <style>
        /* ... предыдущие стили остаются ... */
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .hidden { display: none; }
        a { color: #0f0; text-decoration: none; }
        
        /* Новые стили для костра */
        .bonfire {
            display: none; /* По умолчанию скрыт */
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 150px;
            z-index: 1000;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        
        .bonfire:hover {
            transform: scale(1.1);
        }
        
        .bonfire-flame {
            position: absolute;
            width: 60px;
            height: 80px;
            background: radial-gradient(ellipse at center, 
                rgba(255,100,0,0.9) 0%,
                rgba(255,50,0,0.7) 40%,
                rgba(255,0,0,0.3) 70%,
                transparent 100%);
            border-radius: 50%;
            bottom: 60px;
            left: 20px;
            animation: fire-flicker 1s infinite alternate;
            filter: blur(2px);
        }
        
        .bonfire-wood {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: 
                linear-gradient(45deg, #8B4513 20%, transparent 20%),
                linear-gradient(-45deg, #8B4513 20%, transparent 20%),
                linear-gradient(135deg, #8B4513 20%, transparent 20%),
                linear-gradient(-135deg, #8B4513 20%, transparent 20%);
            background-color: #A0522D;
            border-radius: 5px;
        }
        
        .bonfire-spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFAA00;
            border-radius: 50%;
            animation: spark-float 2s infinite linear;
            opacity: 0;
        }
        
        @keyframes fire-flicker {
            0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.8; }
            50% { transform: scaleY(1.2) scaleX(0.9); opacity: 1; }
        }
        
        @keyframes spark-float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        
        /* Стили для страницы финала с туманом */
        .fog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(50,50,50,0.1) 0%, rgba(0,0,0,0.8) 100%),
                radial-gradient(circle at 80% 80%, rgba(100,100,100,0.1) 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            animation: fog-roll 5s ease-out forwards;
        }
        
        @keyframes fog-roll {
            0% { 
                opacity: 0;
                backdrop-filter: blur(20px);
            }
            100% { 
                opacity: 1;
                backdrop-filter: blur(5px);
            }
        }
        
        .fog-content {
            opacity: 0;
            animation: content-appear 3s 2s ease-out forwards;
        }
        
        @keyframes content-appear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="terminal">
    <!-- Костёр (появится после прохождения квеста) -->
    <div id="bonfire" class="bonfire hidden" onclick="restAtBonfire()" title="Rest at Bonfire - Restore humanity">
        <div class="bonfire-flame"></div>
        <div class="bonfire-wood"></div>
        <!-- Искры -->
        <div class="bonfire-spark" style="left: 30px; animation-delay: 0s;"></div>
        <div class="bonfire-spark" style="left: 50px; animation-delay: 0.5s;"></div>
        <div class="bonfire-spark" style="left: 70px; animation-delay: 1s;"></div>
    </div>

    <div class="container" style="max-width: 800px;">
        <!-- ... остальной код главной страницы ... -->
        
        <script>
            // Проверяем, пройден ли квест (по кукам или localStorage)
            document.addEventListener('DOMContentLoaded', function() {
                const bonfire = document.getElementById('bonfire');
                
                // Проверяем, есть ли отметка о прохождении квеста
                if (localStorage.getItem('quest_completed') === 'true') {
                    // Показываем костёр
                    setTimeout(() => {
                        bonfire.classList.remove('hidden');
                        createSparks();
                    }, 1000);
                    
                    // Добавляем сообщение о костре
                    const menu = document.getElementById('main-menu');
                    if (menu && !menu.classList.contains('hidden')) {
                        const bonfireMsg = document.createElement('p');
                        bonfireMsg.innerHTML = '>> <span style="color: #FF9900;">BONFIRES LIT: 1</span> - You may rest here, Engineer.';
                        bonfireMsg.style.marginTop = '20px';
                        menu.appendChild(bonfireMsg);
                    }
                }
                
                // Создаём дополнительные искры
                function createSparks() {
                    const bonfire = document.getElementById('bonfire');
                    for (let i = 0; i < 10; i++) {
                        const spark = document.createElement('div');
                        spark.className = 'bonfire-spark';
                        spark.style.left = Math.random() * 80 + 10 + 'px';
                        spark.style.animationDelay = Math.random() * 2 + 's';
                        spark.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                        bonfire.appendChild(spark);
                    }
                }
                
                // Функция для "отдыха у костра"
                window.restAtBonfire = function() {
                    alert('>> BONFIRE LIT\n>> HUMANITY RESTORED\n>> Estus Flask replenished\n>> All status effects cured\n\nPraise the Sun! \\[T]/');
                };
            });
        </script>
    </div>
</body>
</html>
